name: Trigger auto deployment for warehouse-frontend-dev-src

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ develop ]
    paths:
    - '**'
    - '.github/workflows/warehouse-frontend-dev-src-AutoDeployTrigger-8e87866b-914c-4735-a51d-16ebd77f7b19.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.WAREHOUSEFRONTENDDEVSRC_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: warehouselearningacr2026-ebdshya8fdayhjaa.azurecr.io
          registryUsername: ${{ secrets.WAREHOUSEFRONTENDDEVSRC_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.WAREHOUSEFRONTENDDEVSRC_REGISTRY_PASSWORD }}
          containerAppName: warehouse-frontend-dev-src
          resourceGroup: rg-warehouse-learning
          buildArguments: NEXT_PUBLIC_API_URL=/api BACKEND_INTERNAL_URL=https://warehouse-backend.bluerock-4c91c171.centralindia.azurecontainerapps.io
          imageToBuild: warehouselearningacr2026-ebdshya8fdayhjaa.azurecr.io/warehouse-frontend:${{ github.sha }}
          
            

     

